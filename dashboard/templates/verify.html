<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - TechBrand Control Center</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .auth-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.3s ease-out;
        }
        .auth-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .auth-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .auth-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
        }
        .otp-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            padding: 0.85rem;
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            text-align: center;
            font-weight: 700;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .otp-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
        }
        .auth-footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="material-symbols-outlined logo-icon" style="color: var(--color-warning); text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);">lock</span>
                <h2>Security Verification</h2>
                <p>We sent a 6-digit verification pincode to your email address.</p>
            </div>

            <form action="/verify" method="POST" class="auth-form">
                <!-- Pass username back to POST verify endpoint -->
                <input type="hidden" name="username" value="{{ username }}">
                
                <div class="form-group">
                    <label for="otp_code">Enter 6-Digit PIN</label>
                    <input type="text" id="otp_code" name="otp_code" class="otp-input" placeholder="000000" maxlength="6" autocomplete="one-time-code" required autofocus>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full" style="padding: 0.85rem; border-radius: 10px;">
                    <span class="material-symbols-outlined" style="font-size: 1.1rem;">verified_user</span> Verify & Enter
                </button>
            </form>

            <div class="auth-footer">
                Back to <a href="/login">Login Screen</a>
            </div>
        </div>
    </div>
</body>
</html>
