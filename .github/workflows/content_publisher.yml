name: "2. Tech Content & Blog Publisher"

on:
  schedule:
    - cron: "0 8 * * *" # Runs daily at 8:00 AM UTC (1:30 PM IST)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Encrypted Content Publishing Engine
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
        run: |
          python content-publishing/cloud_content_publisher.py
