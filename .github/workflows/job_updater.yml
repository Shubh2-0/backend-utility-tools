name: 3. Job Portals Profile Updater (Manual Only)

on:
  workflow_dispatch:

jobs:
  update-job-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Job Portals Updater
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          SHINE_EMAIL: ${{ secrets.SHINE_USERNAME }}
          SHINE_USERNAME: ${{ secrets.SHINE_USERNAME }}
          SHINE_PASSWORD: ${{ secrets.SHINE_PASSWORD }}
          FOUNDIT_EMAIL: ${{ secrets.FOUNDIT_USERNAME }}
          FOUNDIT_USERNAME: ${{ secrets.FOUNDIT_USERNAME }}
          FOUNDIT_PASSWORD: ${{ secrets.FOUNDIT_PASSWORD }}
        run: |
          cd profile-job-updater && python -m scripts.run_all || echo "Job updater manual step executed"
