name: 4. GitHub Growth & Follower Sync Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # 8x daily (every 3 hours: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)

jobs:
  run-follower-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run High-Speed Safe Growth Engine
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAX_FOLLOW: 30
        run: |
          python github-outreach/sync.py

      - name: Save Sync Cache State
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add sync_cache.json followed_users.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore(sync): update high-speed growth engine tracking state [skip ci]" && git push origin master)
