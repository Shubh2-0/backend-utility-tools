name: 4. GitHub Growth & Follower Sync Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,8,16 * * *' # 3x daily at 5:30 AM, 1:30 PM, 9:30 PM IST (00:00, 08:00, 16:00 UTC)

jobs:
  run-follower-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run GitHub Follower Sync & Growth Engine
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAX_FOLLOW: 20
        run: |
          python github-outreach/sync.py

      - name: Save Sync Cache State
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add sync_cache.json followed_users.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore(sync): update sync cache tracking state [skip ci]" && git push origin master)
